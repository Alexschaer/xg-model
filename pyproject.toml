[project]
name = "xg-model"
version = "0.1.0"
description = "xG model built from scratch using StatsBomb open data"
readme = "README.md"
authors = [
    { name = "Alexander Schär", email = "Alexander.Schaer04@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "uvicorn>=0.53.0",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov"

[tool.coverage.run]
source = ["xg_model"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
